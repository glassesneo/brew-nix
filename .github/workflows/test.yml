name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-casks:
    name: build representative casks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run tests
        run: ./test.py

  flake-check:
    name: nix flake check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Check tests flake
        run: nix flake check ./tests --print-build-logs

  gen-tap:
    name: generate a third-party tap
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Generate nikitabobko/tap
        run: |
          mkdir -p "$RUNNER_TEMP/tap"
          nix run .#gen-tap -- nikitabobko/tap > "$RUNNER_TEMP/tap/cask.json"

      - name: Evaluate generated casks
        run: |
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              casks = flake.lib.mkCasks {
                pkgs = flake.inputs.nixpkgs.legacyPackages.aarch64-darwin;
                source = /. + builtins.getEnv "RUNNER_TEMP" + "/tap";
              };
            in
            assert casks ? aerospace;
            builtins.mapAttrs (_: cask: cask.drvPath) casks
          '
